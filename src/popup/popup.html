<!DOCTYPE html>
<html>
<head>
    <title>JSON处理</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="Content-Language" content="zh-cn"/>
    <link rel="stylesheet" type="text/css" href="./style/popup.css">
    <link rel="stylesheet" type="text/css" href="./style/jsonformat.css">
</head>
<body>
<div class="container">

    <div class="button-container">
        <button id="format">格式化</button>
        <button id="compress">压缩</button>
        <button id="escape">转义</button>
        <button id="unescape">去除转义</button>
        <button id="selectDiffMode">JSON 对比</button>
    </div>

    <div id="message" style="display: none; color: red;"></div>
    <div class="editor-container">
        <div style="display: flex; width: 100%">
            <!-- 默认显示单输入框模式 -->
            <div id="singleInputMode">
                <textarea class="json-input" id="jsonInput" placeholder="输入 JSON"></textarea>
                <div id="jsonResult"></div>
            </div>

            <!-- 对比模式下的双输入框 (初始隐藏) -->
            <div id="diffMode" style="display: none; width: 100%">
                <textarea class="json-input" id="jsonInputLeft" placeholder="左侧 JSON"></textarea>
                <textarea class="json-input" id="jsonInputRight" placeholder="右侧 JSON"></textarea>
            </div>
        </div>
    </div>
</div>

<script type="module" src="../../dist/popup.js"></script>
</body>
</html>
